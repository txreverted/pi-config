name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Install fd
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/fd.tar.gz" https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/fd.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/fd-v10.4.2-x86_64-unknown-linux-gnu/fd" /usr/local/bin/fd
      - run: npm ci --ignore-scripts
      - if: matrix.pi == 'latest'
        run: npm install --ignore-scripts --no-save --package-lock=false @earendil-works/pi-ai@latest @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest
      - run: npm run check
